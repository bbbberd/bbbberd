<svg xmlns="http://www.w3.org/2000/svg" width="240" height="50" viewBox="0 0 240 50">
  <style>
    rect { fill: #9cdcfe; transform-box: fill-box; transform-origin: bottom; animation: bounce 1s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: scaleY(0.15); } 50% { transform: scaleY(1); } }
  </style>
  <rect x="0"   y="0" width="14" height="50" style="animation-duration:0.9s;animation-delay:-0.1s"/>
  <rect x="20"  y="0" width="14" height="50" style="animation-duration:1.2s;animation-delay:-0.5s"/>
  <rect x="40"  y="0" width="14" height="50" style="animation-duration:0.8s;animation-delay:-0.3s"/>
  <rect x="60"  y="0" width="14" height="50" style="animation-duration:1.1s;animation-delay:-0.7s"/>
  <rect x="80"  y="0" width="14" height="50" style="animation-duration:0.7s;animation-delay:-0.2s"/>
  <rect x="100" y="0" width="14" height="50" style="animation-duration:1.3s;animation-delay:-0.9s"/>
  <rect x="120" y="0" width="14" height="50" style="animation-duration:0.9s;animation-delay:-0.4s"/>
  <rect x="140" y="0" width="14" height="50" style="animation-duration:1.0s;animation-delay:-0.6s"/>
  <rect x="160" y="0" width="14" height="50" style="animation-duration:0.8s;animation-delay:-0.8s"/>
  <rect x="180" y="0" width="14" height="50" style="animation-duration:1.2s;animation-delay:-0.2s"/>
  <rect x="200" y="0" width="14" height="50" style="animation-duration:0.9s;animation-delay:-0.5s"/>
  <rect x="220" y="0" width="14" height="50" style="animation-duration:1.1s;animation-delay:-0.3s"/>
</svg>
